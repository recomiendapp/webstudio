services:
  webstudio:
    build: .
    container_name: webstudio-app
    restart: always
    networks:
      - x00ossw4sogoso80kck480ow
      - coolify
    environment:
      DATABASE_URL: '${DATABASE_URL}'
      DIRECT_URL: '${DIRECT_URL}'
      POSTGREST_API_KEY: '${POSTGREST_API_KEY}'
      POSTGREST_URL: '${POSTGREST_URL}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      AUTH_SECRET: '${AUTH_SECRET}'
      NODE_ENV: production
      TRUST_PROXY: 'true'
      # --- ESTAS SON LAS VARIABLES QUE ARREGLAN EL ERROR DE URL ---
      APP_URL: 'https://builderstaging.recomiend.app'
      PUBLIC_URL: 'https://builderstaging.recomiend.app'
      COOKIE_DOMAIN: '.builderstaging.recomiend.app' # Punto inicial obligatorio
      # -----------------------------------------------------------
      # Plans/features: FEATURES, USER_PLAN y MAX_ASSETS_PER_PROJECT fueron
      # reemplazados por PLANS (JSON) y FEATURE_FLAGS en el upstream.
      # PLANS define un array de planes; maxAssetsPerProject vive dentro de cada plan.
      # IMPORTANTE: PLANS debe ser JSON valido. Si la variable no esta definida
      # en el .env, el compose la expandiria a "" y el builder fallaria al arrancar,
      # por eso usamos el default "[]".
      PLANS: '${PLANS:-[]}'
      FEATURE_FLAGS: '${FEATURE_FLAGS:-}'
      MAX_UPLOAD_SIZE: '${MAX_UPLOAD_SIZE:-}'
      DEPLOYMENT_ENVIRONMENT: '${DEPLOYMENT_ENVIRONMENT:-}'
      # OAuth entre proyectos (obligatorio si DEPLOYMENT_ENVIRONMENT=production)
      AUTH_WS_CLIENT_ID: '${AUTH_WS_CLIENT_ID:-}'
      AUTH_WS_CLIENT_SECRET: '${AUTH_WS_CLIENT_SECRET:-}'
      # Deployment server AWS (publicación real). Si se omiten, se usa el stub local.
      TRPC_SERVER_URL: '${TRPC_SERVER_URL:-}'
      TRPC_SERVER_API_TOKEN: '${TRPC_SERVER_API_TOKEN:-}'
      # Host bajo el que se publican los proyectos (wildcard SSL)
      PUBLISHER_HOST: '${PUBLISHER_HOST:-}'
      # Motor de IA in-app (Amazon Bedrock). Usa el IAM role del contenedor.
      AI_ENABLED: '${AI_ENABLED:-}'
      AI_MAX_TURNS: '${AI_MAX_TURNS:-}'
      BEDROCK_REGION: '${BEDROCK_REGION:-}'
      BEDROCK_MODEL_ID: '${BEDROCK_MODEL_ID:-}'
      # Credenciales AWS estandar: el SDK las toma automaticamente de la cadena
      # de credenciales por defecto (env vars). El usuario/rol necesita el
      # permiso bedrock:InvokeModel. Si Coolify corre en EC2 con instance
      # profile, puedes omitirlas y el SDK usara el rol de la instancia.
      AWS_REGION: '${AWS_REGION:-}'
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-}'
      AWS_SESSION_TOKEN: '${AWS_SESSION_TOKEN:-}'
    volumes:
      - webstudio_assets:/app/apps/builder/public/cgi/asset/
    labels:
      - traefik.enable=true
      - traefik.http.routers.webstudio-https.rule=Host(`builderstaging.recomiend.app`) || HostRegexp(`^.+\.builderstaging\.recomiend\.app$`)
      - traefik.http.routers.webstudio-https.entryPoints=https
      - traefik.http.routers.webstudio-https.middlewares=gzip
      - traefik.http.routers.webstudio-https.service=webstudio-svc
      - traefik.http.routers.webstudio-https.tls=true
      - traefik.http.routers.webstudio-https.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.webstudio-https.tls.domains[0].main=builderstaging.recomiend.app
      - traefik.http.routers.webstudio-https.tls.domains[0].sans=*.builderstaging.recomiend.app
      - traefik.http.services.webstudio-svc.loadbalancer.server.port=3000

      - traefik.http.routers.webstudio-http.rule=Host(`builderstaging.recomiend.app`) || HostRegexp(`^.+\.builderstaging\.recomiend\.app$`)
      - traefik.http.routers.webstudio-http.entryPoints=http
      - traefik.http.routers.webstudio-http.middlewares=redirect-to-https

      - traefik.http.middlewares.gzip.compress=true
volumes:
  webstudio_assets:
    driver: local
networks:
  x00ossw4sogoso80kck480ow:
    name: x00ossw4sogoso80kck480ow
    external: true
  coolify:
    name: coolify
    external: true