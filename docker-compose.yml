services:
  webstudio:
    build: .
    container_name: webstudio-app
    restart: always
    networks:
      - x00ossw4sogoso80kck480ow
      - coolify
    environment:
      DATABASE_URL: '${DATABASE_URL}'
      DIRECT_URL: '${DIRECT_URL}'
      POSTGREST_API_KEY: '${POSTGREST_API_KEY}'
      POSTGREST_URL: '${POSTGREST_URL}'
      GOOGLE_CLIENT_ID: '${GOOGLE_CLIENT_ID}'
      GOOGLE_CLIENT_SECRET: '${GOOGLE_CLIENT_SECRET}'
      AUTH_SECRET: '${AUTH_SECRET}'
      NODE_ENV: production
      TRUST_PROXY: 'true'
      # --- ESTAS SON LAS VARIABLES QUE ARREGLAN EL ERROR DE URL ---
      APP_URL: 'https://builderstaging.recomiend.app'
      PUBLIC_URL: 'https://builderstaging.recomiend.app'
      COOKIE_DOMAIN: '.builderstaging.recomiend.app' # Punto inicial obligatorio
      # -----------------------------------------------------------
      # Plans/features: FEATURES, USER_PLAN y MAX_ASSETS_PER_PROJECT fueron
      # reemplazados por PLANS (JSON) y FEATURE_FLAGS en el upstream.
      # PLANS debe ser JSON valido; default "[]" para no romper el arranque.
      PLANS: '${PLANS:-[]}'
      FEATURE_FLAGS: '${FEATURE_FLAGS:-}'
      MAX_UPLOAD_SIZE: '${MAX_UPLOAD_SIZE:-}'
      DEPLOYMENT_ENVIRONMENT: '${DEPLOYMENT_ENVIRONMENT:-}'
      AUTH_WS_CLIENT_ID: '${AUTH_WS_CLIENT_ID:-}'
      AUTH_WS_CLIENT_SECRET: '${AUTH_WS_CLIENT_SECRET:-}'
      TRPC_SERVER_URL: '${TRPC_SERVER_URL:-}'
      TRPC_SERVER_API_TOKEN: '${TRPC_SERVER_API_TOKEN:-}'
      PUBLISHER_HOST: '${PUBLISHER_HOST:-}'
    volumes:
      - webstudio_assets:/app/apps/builder/public/cgi/asset/
    labels:
      - traefik.enable=true
      # Router HTTPS con sintaxis simplificada para que Coolify no falle el build
      - traefik.http.routers.webstudio-https.rule=Host(`builderstaging.recomiend.app`) || HostRegexp(`^.+\.builderstaging\.recomiend\.app$`)
      - traefik.http.routers.webstudio-https.entryPoints=https
      - traefik.http.routers.webstudio-https.middlewares=gzip
      - traefik.http.routers.webstudio-https.service=webstudio-svc
      - traefik.http.routers.webstudio-https.tls.certresolver=letsencrypt
      - traefik.http.services.webstudio-svc.loadbalancer.server.port=3000
      - traefik.http.routers.webstudio-https.tls=true
      - traefik.http.routers.webstudio-https.priority=100
      
      # Redirección HTTP a HTTPS
      - traefik.http.routers.webstudio-http.rule=Host(`builderstaging.recomiend.app`) || HostRegexp(`^.+\.builderstaging\.recomiend\.app$`)
      - traefik.http.routers.webstudio-http.entryPoints=http
      - traefik.http.routers.webstudio-http.middlewares=redirect-to-https

      # Middlewares
      - traefik.http.middlewares.webstudio-proto.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.middlewares.gzip.compress=true
volumes:
  webstudio_assets:
    driver: local
networks:
  x00ossw4sogoso80kck480ow:
    name: x00ossw4sogoso80kck480ow
    external: true
  coolify:
    name: coolify
    external: true